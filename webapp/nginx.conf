server {
    listen 80;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy api requests if needed, but here we assume direct browser to server
    # location /api {
    #    proxy_pass http://server:4000;
    # }
}
